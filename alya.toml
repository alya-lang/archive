[package]
name = "archive"
version = "0.1.0"
alya-version = "0.0.19"
entry = "src/lib.alya"
description = "Multi-format archive toolkit for Alya: TAR/USTAR, ZIP stored/deflate and TAR.GZ packing with CRC integrity, powered by compress codecs"
authors = ["Alya Language Contributors <https://github.com/alya-lang>"]
license = "MIT"
homepage = "https://github.com/alya-lang/alya"
repository = "https://github.com/alya-lang/archive"
keywords = ["alya", "alya-lang", "package", "archive", "tar", "zip", "gzip", "archiver", "compression"]

[dependencies]
compress = { git = "https://github.com/alya-lang/compress", tag = "v0.1.0" }

[build]
c-sources = ["c/archive.c"]
c-flags = ["-O2"]
c-include-dirs = ["c"]
links = "archive"

